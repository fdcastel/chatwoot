name: Custom Release

on:
  push:
    branches:
      - custom-release
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fdcastel/chatwoot

jobs:
  test-frontend:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run eslint

      - name: Test
        run: pnpm run test:coverage

  test-backend:
    name: Backend — Rubocop & RSpec
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: ruby/setup-ruby@v1
        with:
          bundler: '2.5.16'
          bundler-cache: false

      - name: Install Ruby gems
        run: bundle install --jobs 4 --retry 3

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Strip enterprise code
        run: rm -rf enterprise spec/enterprise

      - name: Lint Ruby
        run: bundle exec rubocop --parallel

      - name: Set up database
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load

      - name: Run RSpec
        run: bundle exec rspec
        env:
          NODE_OPTIONS: --openssl-legacy-provider

  detect_changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      only_docs: ${{ steps.detect.outputs.only_docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          set -euo pipefail
          # On branch creation there is no 'before' commit; run build in that case
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "only_docs=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
          echo "Changed files: $files"
          only_docs=true
          for f in $files; do
            # If any file is not in docs/ and doesn't end with .md, consider it a non-doc change
            if ! echo "$f" | grep -Eq '^docs/|\.md$'; then
              only_docs=false
              break
            fi
          done
          echo "only_docs=$only_docs" >> $GITHUB_OUTPUT

  docker:
    name: Build & Push Docker image
    needs: [test-frontend, test-backend, detect_changes]
    if: ${{ needs.detect_changes.outputs.only_docs != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(cat VERSION_CW)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
